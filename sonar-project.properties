# Project identification
sonar.projectKey=notes-app
sonar.projectName=Notes App
sonar.projectVersion=1.0

# Source code (FIXED)
sonar.sources=backend,frontend/src

# Base directory
sonar.projectBaseDir=.

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.vite/**,**/build/**,**/*.test.js,**/*.test.jsx,**/__tests__/**

# Coverage — BOTH frontend and backend
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# Exclude test files from coverage analysis
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/__tests__/**,**/setupTests.js,**/__mocks__/**

# Server
sonar.host.url=http://localhost:9000

